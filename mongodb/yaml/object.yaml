apiVersion: kubedb.com/v1
kind: MongoDB
metadata:
  name: mg-standalone4
  namespace: demo
spec:
  version: "4.4.26"
  storageType: Durable
  storage:
    storageClassName: "local-path"
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
  podTemplate:
    spec:
      imagePullSecrets:
        - name: regcred
