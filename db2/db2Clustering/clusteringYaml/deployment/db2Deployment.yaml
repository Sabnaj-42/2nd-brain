apiVersion: apps/v1
kind: Deployment
metadata:
  name: db2
  namespace: db2-system-test
spec:
  replicas: 4
  selector:
    matchLabels:
      app: db2
  template:
    metadata:
      labels:
        app: db2
    spec:
      containers:
        - name: db2
          image: ibmcom/db2:11.5.8.0
          ports:
            - containerPort: 50000
          securityContext:
            privileged: true
          env:
            - name: DB2INST1_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db2-secrets
                  key: DB2INST1_PASSWORD
            - name: LICENSE
              value: accept
          volumeMounts:
            - mountPath: /database
              name: db2-data
      volumes:
        - name: db2-data
          persistentVolumeClaim: 
            claimName: db2-pvc
