<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">KubeDB etcd operator — architecture</title>
  <desc id="desc">Architecture poster for the kubedb.dev/etcd operator: the three binaries that run its controllers, the central Etcd custom resource, every Kubernetes object its reconciler owns, and the surrounding systems (cert-manager, KubeStash, the EtcdVersion catalog, and the license/audit pipeline) it integrates with.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="hubBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1800" height="1180" fill="url(#pageBg)"/>

  <!-- Hero band -->
  <rect x="0" y="0" width="1800" height="130" fill="url(#heroBg)"/>
  <text x="900" y="60" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ffffff">KubeDB etcd operator — architecture</text>
  <text x="900" y="95" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#c7d2fe">kubedb.dev/etcd — one CRD, three binaries, a Raft-aware reconciler</text>

  <!-- Section label 1 -->
  <text x="900" y="155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#475569">HOW THE RECONCILER RUNS — THREE COBRA BINARIES, ONE CRD</text>

  <!-- Connector lines: row1 -> hub (drawn first, behind boxes) -->
  <g stroke="#475569" stroke-width="2" fill="none" opacity="0.7">
    <line x1="240"  y1="320" x2="770"  y2="380" marker-end="url(#arrow)"/>
    <line x1="680"  y1="320" x2="850"  y2="380" marker-end="url(#arrow)"/>
    <line x1="1120" y1="320" x2="950"  y2="380" marker-end="url(#arrow)"/>
    <line x1="1560" y1="320" x2="1030" y2="380" marker-end="url(#arrow)"/>
  </g>

  <!-- Spine: hub -> owned-object rows (drawn behind the boxes it threads through) -->
  <line x1="900" y1="470" x2="900" y2="900" stroke="#64748b" stroke-width="3" opacity="0.55"/>
  <!-- Junction fans -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.8">
    <line x1="900" y1="495" x2="200"  y2="520"/>
    <line x1="900" y1="495" x2="550"  y2="520"/>
    <line x1="900" y1="495" x2="900"  y2="520"/>
    <line x1="900" y1="495" x2="1250" y2="520"/>
    <line x1="900" y1="495" x2="1600" y2="520"/>

    <line x1="900" y1="645" x2="200"  y2="660"/>
    <line x1="900" y1="645" x2="550"  y2="660"/>
    <line x1="900" y1="645" x2="900"  y2="660"/>
    <line x1="900" y1="645" x2="1250" y2="660"/>
    <line x1="900" y1="645" x2="1600" y2="660"/>

    <line x1="900" y1="785" x2="550"  y2="800"/>
    <line x1="900" y1="785" x2="900"  y2="800"/>
    <line x1="900" y1="785" x2="1250" y2="800"/>
  </g>

  <!-- ROW 1: process / binaries (indigo) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="40" y="170" width="400" height="150" rx="12" fill="#3730a3" stroke="#1e1b4b" stroke-width="1.5"/>
      <rect x="480" y="170" width="400" height="150" rx="12" fill="#3730a3" stroke="#1e1b4b" stroke-width="1.5"/>
      <rect x="920" y="170" width="400" height="150" rx="12" fill="#3730a3" stroke="#1e1b4b" stroke-width="1.5"/>
      <rect x="1360" y="170" width="400" height="150" rx="12" fill="#3730a3" stroke="#1e1b4b" stroke-width="1.5"/>
    </g>
    <g fill="#ffffff" text-anchor="middle">
      <text x="240" y="204" font-size="17" font-weight="700">kubedb-provisioner</text>
      <text x="240" y="232" font-size="13" fill="#c7d2fe">(embedded — production path)</text>
      <text x="240" y="256" font-size="12" fill="#a5b4fc" font-family="monospace">SetupControllers(mgr, ...)</text>

      <text x="680" y="204" font-size="17" font-weight="700">etcd-operator operator</text>
      <text x="680" y="232" font-size="13" fill="#c7d2fe">(standalone process)</text>
      <text x="680" y="256" font-size="12" fill="#a5b4fc" font-family="monospace">cmd/etcd-operator</text>

      <text x="1120" y="204" font-size="17" font-weight="700">etcd-operator run</text>
      <text x="1120" y="232" font-size="13" fill="#c7d2fe">(admission webhook)</text>
      <text x="1120" y="256" font-size="12" fill="#a5b4fc" font-family="monospace">mutating + validating</text>

      <text x="1560" y="204" font-size="17" font-weight="700">etcd-ops operator</text>
      <text x="1560" y="232" font-size="13" fill="#c7d2fe">(ops-requests + TLS)</text>
      <text x="1560" y="256" font-size="12" fill="#a5b4fc" font-family="monospace">cmd/etcd-ops</text>
    </g>
  </g>

  <!-- HUB: the Etcd CR -->
  <g filter="url(#shadow)">
    <rect x="650" y="380" width="500" height="90" rx="14" fill="url(#hubBg)" stroke="#334155" stroke-width="2"/>
  </g>
  <text x="900" y="418" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Etcd custom resource</text>
  <text x="900" y="444" text-anchor="middle" font-size="13" fill="#93c5fd" font-family="monospace">kubedb.com/v1alpha2, kind: Etcd</text>

  <!-- Section label 2 -->
  <text x="900" y="505" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#475569">WHAT THE RECONCILER OWNS — CREATED / PATCHED FOR EVERY Etcd OBJECT</text>

  <!-- ROW A -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <rect x="40" y="520" width="320" height="110" rx="10"/>
      <rect x="390" y="520" width="320" height="110" rx="10"/>
      <rect x="740" y="520" width="320" height="110" rx="10"/>
      <rect x="1090" y="520" width="320" height="110" rx="10"/>
      <rect x="1440" y="520" width="320" height="110" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="200" y="558" font-size="14.5" font-weight="700" fill="#1e3a8a">PetSet → Pods</text>
      <text x="200" y="584" font-size="12" fill="#334155">kubeops.dev/petset</text>

      <text x="550" y="558" font-size="14.5" font-weight="700" fill="#1e3a8a">Governing Service</text>
      <text x="550" y="584" font-size="12" fill="#334155">headless, PublishNotReadyAddresses</text>

      <text x="900" y="558" font-size="14.5" font-weight="700" fill="#1e3a8a">Client Service</text>
      <text x="900" y="584" font-size="12" fill="#334155">primary, ClusterIP, port 2379</text>

      <text x="1250" y="558" font-size="14.5" font-weight="700" fill="#1e3a8a">Stats Service</text>
      <text x="1250" y="584" font-size="12" fill="#334155">only if Prometheus monitoring on</text>

      <text x="1600" y="558" font-size="14.5" font-weight="700" fill="#1e3a8a">Cluster-State ConfigMap</text>
      <text x="1600" y="584" font-size="12" fill="#334155">ETCD_INITIAL_CLUSTER, ...</text>
    </g>
  </g>

  <!-- ROW B -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <rect x="40" y="660" width="320" height="110" rx="10"/>
      <rect x="390" y="660" width="320" height="110" rx="10"/>
      <rect x="740" y="660" width="320" height="110" rx="10"/>
      <rect x="1090" y="660" width="320" height="110" rx="10"/>
      <rect x="1440" y="660" width="320" height="110" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="200" y="698" font-size="14.5" font-weight="700" fill="#1e3a8a">Auth Secret</text>
      <text x="200" y="724" font-size="12" fill="#334155">basic-auth, generated root password</text>

      <text x="550" y="698" font-size="14.5" font-weight="700" fill="#1e3a8a">TLS: server cert</text>
      <text x="550" y="724" font-size="12" fill="#334155">client API listener</text>

      <text x="900" y="698" font-size="14.5" font-weight="700" fill="#1e3a8a">TLS: peer cert</text>
      <text x="900" y="724" font-size="12" fill="#334155">mutually-authenticated raft traffic</text>

      <text x="1250" y="698" font-size="14.5" font-weight="700" fill="#1e3a8a">TLS: client cert</text>
      <text x="1250" y="724" font-size="12" fill="#334155">operator's own client, CN=root</text>

      <text x="1600" y="698" font-size="14.5" font-weight="700" fill="#1e3a8a">ServiceAccount</text>
      <text x="1600" y="724" font-size="12" fill="#334155">+ Role + RoleBinding</text>
    </g>
  </g>

  <!-- ROW C -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5">
      <rect x="390" y="800" width="320" height="100" rx="10"/>
      <rect x="740" y="800" width="320" height="100" rx="10"/>
      <rect x="1090" y="800" width="320" height="100" rx="10"/>
    </g>
    <g text-anchor="middle">
      <text x="550" y="836" font-size="14.5" font-weight="700" fill="#1e3a8a">PodDisruptionBudget</text>
      <text x="550" y="860" font-size="12" fill="#334155">quorum-aware, owned by the PetSet</text>

      <text x="900" y="836" font-size="14.5" font-weight="700" fill="#1e3a8a">AppBinding</text>
      <text x="900" y="860" font-size="12" fill="#334155">appcatalog.appscode.com — consumers dial via this</text>

      <text x="1250" y="836" font-size="14.5" font-weight="700" fill="#1e3a8a">BackupConfiguration</text>
      <text x="1250" y="860" font-size="12" fill="#334155">KubeStash, only if an EtcdArchiver is attached</text>
    </g>
  </g>

  <!-- Section label 3 -->
  <text x="900" y="925" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#475569">SURROUNDING SYSTEMS</text>

  <!-- ROW EXTERNAL -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g filter="url(#shadow)" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5">
      <rect x="40" y="940" width="400" height="140" rx="12"/>
      <rect x="480" y="940" width="400" height="140" rx="12"/>
      <rect x="920" y="940" width="400" height="140" rx="12"/>
      <rect x="1360" y="940" width="400" height="140" rx="12"/>
    </g>
    <g text-anchor="middle">
      <text x="240" y="974" font-size="16" font-weight="700" fill="#78350f">cert-manager</text>
      <text x="240" y="1000" font-size="12.5" fill="#92400e">Issuer / ClusterIssuer / Certificate</text>
      <text x="240" y="1024" font-size="12" fill="#b45309" font-style="italic">↳ issues the 3 TLS secrets above</text>

      <text x="680" y="974" font-size="16" font-weight="700" fill="#78350f">KubeStash</text>
      <text x="680" y="1000" font-size="12.5" fill="#92400e">BackupConfiguration · RestoreSession</text>
      <text x="680" y="1024" font-size="12" fill="#b45309" font-style="italic">↳ full etcd snapshot + manifest backup</text>

      <text x="1120" y="974" font-size="16" font-weight="700" fill="#78350f">EtcdVersion catalog</text>
      <text x="1120" y="1000" font-size="12.5" fill="#92400e">catalog.kubedb.com/v1alpha1</text>
      <text x="1120" y="1024" font-size="12" fill="#b45309" font-style="italic">↳ resolves spec.version → image</text>

      <text x="1560" y="974" font-size="16" font-weight="700" fill="#78350f">license-verifier + audit</text>
      <text x="1560" y="1000" font-size="12.5" fill="#92400e">community license → demo-namespace only</text>
      <text x="1560" y="1024" font-size="12" fill="#b45309" font-style="italic">↳ audit events published to NATS</text>
    </g>
  </g>

  <!-- Legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#334155">
    <rect x="600" y="1102" width="16" height="16" rx="3" fill="#3730a3"/>
    <text x="624" y="1114">process / binary</text>
    <rect x="800" y="1102" width="16" height="16" rx="3" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="824" y="1114">Kubernetes object owned by the reconciler</text>
    <rect x="1140" y="1102" width="16" height="16" rx="3" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="1164" y="1114">external system</text>
  </g>
  <text x="900" y="1155" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#94a3b8">kubedb.dev/etcd — design reference diagram</text>
</svg>
