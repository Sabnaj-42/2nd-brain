apiVersion: kubedb.com/v1alpha2
kind: Milvus
metadata:
  name: milvus-mon
  namespace: demo
spec:
  version: 2.6.11
  storageType: Durable
  deletionPolicy: WipeOut

  topology:
    mode: Standalone

  # etcd metadata store, managed by KubeDB
  metaStorage:
    externallyManaged: false
    size: 3
    storageType: Durable
    storage:
      accessModes:
        - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi

  # MinIO / S3 connection details
  objectStorage:
    configSecret:
      name: milvus-storage-config

  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        storage: 10Gi

  # ---- monitoring ----
  monitor:
    agent: prometheus.io/operator
    prometheus:
      exporter:
        port: 9091          # kubedb.MilvusMetricsPort; optional, this is the default
      serviceMonitor:
        interval: 10s
        labels:
          release: kube-prometheus-stack   # MUST match the Prometheus serviceMonitorSelector

  healthChecker:
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 3

  podTemplate:
    spec:
      containers:
        - name: milvus
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 2Gi