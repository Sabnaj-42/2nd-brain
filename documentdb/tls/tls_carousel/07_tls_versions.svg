<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1080" height="1080" fill="#0B1120"/>
  <rect x="0" y="0" width="1080" height="8" fill="#FBBF24"/>

  <!-- header -->
  <circle cx="105" cy="120" r="40" fill="#FBBF24"/>
  <text x="105" y="135" text-anchor="middle" fill="#0B1120" font-size="44" font-weight="700">7</text>
  <text x="170" y="115" fill="#F1F5F9" font-size="46" font-weight="700">TLS versions</text>
  <text x="170" y="165" fill="#FBBF24" font-size="32" font-weight="600">and why 1.3 wins</text>

  <!-- version rows -->
  <g font-weight="600">
    <rect x="55" y="210" width="970" height="72" rx="14" fill="#2A0F14" stroke="#F87171" stroke-width="2"/>
    <text x="85" y="255" fill="#F87171" font-size="28">1.0 / 1.1</text>
    <text x="330" y="255" fill="#FCA5A5" font-size="26">weak · deprecated (2020–21)</text>

    <rect x="55" y="296" width="970" height="72" rx="14" fill="#16213A" stroke="#FBBF24" stroke-width="2"/>
    <text x="85" y="341" fill="#FBBF24" font-size="28">1.2</text>
    <text x="330" y="341" fill="#CBD5E1" font-size="26">common · RSA key exchange</text>

    <rect x="55" y="382" width="970" height="72" rx="14" fill="#16213A" stroke="#34D399" stroke-width="2.5"/>
    <text x="85" y="427" fill="#34D399" font-size="28">1.3</text>
    <text x="330" y="427" fill="#CBD5E1" font-size="26">current · faster + safer ✓</text>
  </g>

  <!-- why 1.3 -->
  <rect x="55" y="480" width="970" height="120" rx="18" fill="#2A0F14" stroke="#F87171" stroke-width="2"/>
  <text x="85" y="530" fill="#F87171" font-size="26" font-weight="700">RSA's risk</text>
  <text x="85" y="572" fill="#F1F5F9" font-size="26">one long-lived key — leak it and <tspan fill="#F87171" font-weight="700">past traffic decrypts</tspan></text>

  <!-- ephemeral DH -->
  <rect x="55" y="618" width="970" height="230" rx="18" fill="#16213A" stroke="#34D399" stroke-width="2.5"/>
  <text x="85" y="668" fill="#34D399" font-size="27" font-weight="700">1.3 → ephemeral Diffie-Hellman</text>

  <g text-anchor="middle" font-weight="600" font-size="22">
    <rect x="85" y="695" width="200" height="70" rx="12" fill="#0B1120" stroke="#60A5FA" stroke-width="2"/>
    <text x="185" y="730" fill="#60A5FA">You</text>
    <text x="185" y="752" fill="#94A3B8" font-size="17" font-weight="400">throwaway key</text>

    <rect x="795" y="695" width="200" height="70" rx="12" fill="#0B1120" stroke="#34D399" stroke-width="2"/>
    <text x="895" y="730" fill="#34D399">Server</text>
    <text x="895" y="752" fill="#94A3B8" font-size="17" font-weight="400">throwaway key</text>

    <text x="540" y="720" fill="#CBD5E1">swap public keys ⇄</text>
    <text x="540" y="752" fill="#FBBF24">each derives the SAME secret</text>
  </g>
  <line x1="287" y1="730" x2="440" y2="730" stroke="#64748B" stroke-width="2.5"/>
  <line x1="640" y1="730" x2="793" y2="730" stroke="#64748B" stroke-width="2.5"/>
  <text x="540" y="812" text-anchor="middle" fill="#94A3B8" font-size="22" font-style="italic">secret never sent · keys discarded after the session</text>

  <!-- forward secrecy -->
  <rect x="55" y="866" width="970" height="80" rx="18" fill="#0B2A1A" stroke="#34D399" stroke-width="2.5"/>
  <text x="540" y="915" text-anchor="middle" fill="#34D399" font-size="27" font-weight="700">Leaked key can't unlock past traffic = forward secrecy</text>

  <text x="70" y="1035" fill="#475569" font-size="24">How HTTPS Really Works</text>
  <text x="1010" y="1035" text-anchor="end" fill="#475569" font-size="24">8 / 9</text>
</svg>
