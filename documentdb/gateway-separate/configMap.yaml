apiVersion: v1
kind: ConfigMap
metadata:
  name: documentdb-gateway-config
  namespace: demo
data:
  SetupConfiguration.json: |
    {
      "NodeHostName": "pg-demo.demo.svc.cluster.local",
      "BlockedRolePrefixes": [ "documentdb", "citus", "pg", "internal_role" ],
      "PostgresHostName": "pg-demo.demo.svc.cluster.local",
      "PostgresPort": 5432,
      "PostgresDatabase": "postgres",
      "PostgresSystemUser": "postgres",
      "PostgresDataUser": "postgres",
      "PostgresDataUserPassword": "MqOrM22kP7)gIq68",
      "GatewayListenPort": 27017,
      "CertificateOptions": {
        "CertType": "PemAutoGenerated",
        "CertPath": "/tmp/certs",
        "KeyPath": "/tmp/certs"
      },
      "AuthenticationOptions": {
         "RequireAuthentication": false
      },
      "UseLocalHost": false,
      "DynamicConfigurationFile": "/etc/documentdb/HostConfig.json",
      "DynamicConfigurationRefreshIntervalSecs": 300
    }
  HostConfig.json: |
    {
      "IsPrimary": "true",
      "SendShutdownResponses": "false"
    }