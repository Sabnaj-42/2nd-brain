  name: dcdb-reconfigure-tls
  namespace: demo
spec:
  type: ReconfigureTLS
  databaseRef:
    name: dcdb
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: x
    certificates:
      - alias: client
