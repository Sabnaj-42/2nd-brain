apiVersion: kubedb.com/v1alpha2
kind: DocumentDB
metadata:
  name: documentdb
  namespace: demo
spec:
  version: '17.9'
  storageType: Durable
  deletionPolicy: Delete
  replicas: 2
  podTemplate:
    spec:
      containers:
        - name: documentdb
          resources:
            requests:
              cpu: 500m
              memory: 2Gi

  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi
