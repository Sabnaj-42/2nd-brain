# DocumentDB test instance for documentdb-backup-command.md
#
#   kubectl apply -f docdb.yaml
#   kubectl get documentdb -n ddb-hands -w        # wait for Ready (~40s)
#
# Verified against KubeDB v2026.8.14-rc.0 (API kubedb.com/v1alpha2).
---
apiVersion: v1
kind: Namespace
metadata:
  name: ddb-hands
---
apiVersion: kubedb.com/v1alpha2
kind: DocumentDB
metadata:
  name: docdb
  namespace: ddb-hands
spec:
  version: 'pg17-0.109.0-walg'
  replicas: 1
  storageType: Durable

  # 'disable' turns off TLS on the PostgreSQL wire (port 9712) only.
  # The MongoDB gateway on 10260 still requires TLS regardless — every
  # mongosh URI in the runbook needs tls=true&tlsAllowInvalidCertificates=true.
  sslMode: disable

  storage:
    accessModes:
      - ReadWriteOnce
    storageClassName: local-path
    resources:
      requests:
        # 2Gi is enough for the dataset, but WAL accumulates in
        # /var/pv/wal_archive once §2 of the runbook enables archiving
        # (177 MB after one drill) and nothing prunes it. 5Gi leaves room.
        storage: 5Gi

  podTemplate:
    spec:
      containers:
        - name: documentdb
          resources:
            requests:
              cpu: 500m
              memory: 2Gi

  # WipeOut: deleting this CR also deletes the PVC and the auth Secrets.
  # Correct for a scratch test namespace; never use it on anything real.
  deletionPolicy: WipeOut
