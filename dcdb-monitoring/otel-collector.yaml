apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: demo
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
      sqlquery:
        driver: postgres
        datasource: "host=dcdb.demo.svc.cluster.local port=9712 user=documentdb password=PGPASS dbname=postgres sslmode=disable"
        queries:
          - sql: "SELECT 1 AS up"
            metrics:
              - metric_name: "documentdb.postgres.up"
                value_column: "up"
                data_type: gauge
          - sql: "SELECT count(*) AS total_connections FROM pg_stat_activity"
            metrics:
              - metric_name: "documentdb.postgres.connections"
                value_column: "total_connections"
                data_type: gauge
          - sql: "SELECT count(*) AS locks FROM pg_locks"
            metrics:
              - metric_name: "documentdb.postgres.locks"
                value_column: "locks"
                data_type: gauge
        collection_interval: 30s

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch:
        send_batch_size: 1024
        timeout: 5s

    exporters:
      prometheus:
        endpoint: 0.0.0.0:8888

    service:
      pipelines:
        metrics:
          receivers: [otlp, sqlquery]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-pg-secret
  namespace: demo
stringData:
  pg-password: "PLACEHOLDER"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: demo
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
      - name: otel-collector
        image: otel/opentelemetry-collector-contrib:0.124.0
        args:
        - "--config=/etc/otel/config.yaml"
        ports:
        - name: otlp
          containerPort: 4317
          protocol: TCP
        - name: metrics
          containerPort: 8888
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/otel
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: demo
  labels:
    app: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
  - name: otlp
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: metrics
    port: 8888
    targetPort: 8888
    protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: demo
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: otel-collector
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
