spec:
  type: VerticalScaling
  databaseRef:
    name: cassandra-prod
  verticalScaling:
    mode: Restart          # <- defaulted by the CRD, I didn't set it
    node:
      resources:
        requests:
          cpu: "2"
          memory: 3Gi
        limits:
          cpu: "3"
          memory: 4Gi
  timeout: 5m
  apply: IfReady


