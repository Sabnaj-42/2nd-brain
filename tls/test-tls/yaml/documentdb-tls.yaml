apiVersion: kubedb.com/v1alpha2
kind: DocumentDB
metadata:
  name: dcdb-tls
  namespace: demo
spec:
  version: pg17-0.109.0
  replicas: 2
  # Postgres SSL policy. verify-full = strongest (cert + hostname verification).
  sslMode: verify-full
  # cert-manager issues server / client(replication) / gateway certs from this issuer.
  tls:
    issuerRef:
      apiGroup: cert-manager.io
      kind: Issuer
      name: dcdb-ca-issuer
  # Drop Kubernetes service-link env injection (the namespace's cassandra-quickstart etc.
  # Service vars) from the pods; the app uses only its own explicit env.
  podTemplate:
    spec:
      enableServiceLinks: false
  storageType: Durable
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1Gi
    storageClassName: local-path
  deletionPolicy: WipeOut
