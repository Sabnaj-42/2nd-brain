apiVersion: kubedb.com/v1alpha2
kind: DB2
metadata:
  name: my-db2
  namespace: demo
spec:
  deletionPolicy: Delete
  podTemplate:
    spec:
      containers:
        - name: db2
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
      podPlacementPolicy:
        name: default
  replicas: 1
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 1G
  storageType: Durable
  version: 11.5.8.0
  hadrConfig:
    name: hadr-config
