apiVersion: kubedb.com/v1alpha2
kind: DB2
metadata:
  name: my-db2
  namespace: demo
spec:
  version: 11.5.8.0
  storageType: Durable
  deletionPolicy: Delete
  replicas: 3

  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 5Gi

  podTemplate:
    spec:
      imagePullSecrets:
        - name: my-registry-secret

      containers:
        - name: db2
          resources:
            requests:
              cpu: 500m
              memory: 2Gi

      volumes:
        - name: config-map
          configMap:
            name: hadr-config

      podPlacementPolicy:
        name: default

  hadrConfig:
    name: hadr-config
