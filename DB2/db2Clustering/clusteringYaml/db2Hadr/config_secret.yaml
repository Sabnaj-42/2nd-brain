apiVersion: v1
kind: Secret
metadata:
  name: db2-hadr-config  # Must match hadrConfig[0].name
  namespace: production
type: Opaque
stringData:  # Use stringData for readable YAML (or data: with base64)
  hadr-config.yaml: |
    # Database name is the key - must match metadata.name of DB2 object
    my-db2-instance:
      primary: 1
      standby: 2
      configSecret:
        name: db2-primary-auth
      serviceTemplates:
        - alias: primary
          metadata:
            labels:
              role: hadr-primary
              hadr-mode: sync
          spec:
            type: LoadBalancer
            ports:
            - name: db2-hadr
              port: 5900
              targetPort: 5900
    
